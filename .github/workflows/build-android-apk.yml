name: Build SUNVILOZ Clean Care Android APK

on:
  workflow_dispatch:
    inputs:
      apps_script_webapp_url:
        description: "Optional default Apps Script Web App /exec URL (leave blank to configure on first launch)"
        required: false
        default: ""

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK 35 & Build Tools 35.0.0
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "Installing Android command-line tools into $SDK_ROOT..."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -qo /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            rm -f /tmp/cmdline-tools.zip
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Gradle wrapper & resources
        shell: bash
        run: |
          set -euo pipefail
          rm -f android/local.properties
          rm -f android/app/src/main/res/drawable/ic_launcher_foreground.xml
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ] || ! unzip -tq android/gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "gradle-wrapper.jar missing or invalid; bootstrapping Gradle 8.10.2 wrapper..."
            curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle-8.10.2.zip
            unzip -qo /tmp/gradle-8.10.2.zip -d /tmp
            (cd android && /tmp/gradle-8.10.2/bin/gradle wrapper --gradle-version 8.10.2 --no-daemon)
            rm -f /tmp/gradle-8.10.2.zip
          fi

      - name: Build Debug APK
        working-directory: android
        env:
          APPS_SCRIPT_WEBAPP_URL: ${{ github.event.inputs.apps_script_webapp_url }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK signature with apksigner
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$APK_PATH"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_PATH"
          cp "$APK_PATH" SUNVILOZ-Clean-Care.apk

      - name: Upload SUNVILOZ-Clean-Care.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SUNVILOZ-Clean-Care-Debug-APK
          path: SUNVILOZ-Clean-Care.apk
          retention-days: 30
